<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Gallery Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #00ffcc;
        }

        /* THE FIX: Dictates exactly 3 equal columns per row */
        .sprite-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            gap: 24px; /* Space between rows and columns */
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Styling for individual sprite cards */
        .sprite-card {
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .sprite-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
        }

        .sprite-display {
            background-color: #111; /* Dark checkerboard or contrast background for sprites */
            border-radius: 4px;
            padding: 20px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sprite-display img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            image-rendering: pixelated; /* Keeps pixel art sharp */
        }

        .sprite-info h3 {
            margin: 15px 0 5px 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .sprite-info p {
            margin: 5px 0;
            font-size: 0.85rem;
            color: #aaa;
        }

        /* Responsive design: switches to 1 column on mobile phones */
        @media (max-width: 768px) {
            .sprite-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Free Sprite Assets Gallery</h1>
    
    <!-- This container will display the items 3 per row -->
    <div class="sprite-grid" id="spriteGrid">
        <!-- Sprites will be injected here dynamically by JavaScript -->
    </div>

    <script>
        // Replace with your actual Render backend URL if running live
        const API_URL = "http://127.0.0.1:8000"; 

        async function fetchSprites() {
            try {
                const response = await fetch(`${API_URL}/api/sprites`);
                const sprites = await response.json();
                const grid = document.getElementById('spriteGrid');
                
                grid.innerHTML = ''; // Clear fallback text

                sprites.forEach(sprite => {
                    // Combine base backend URL with relative file path if necessary
                    const fullImgUrl = sprite.file_url.startsWith('http') ? sprite.file_url : `${API_URL}${sprite.file_url}`;
                    
                    const card = document.createElement('div');
                    card.className = 'sprite-card';
                    card.innerHTML = `
                        <div class="sprite-display">
                            <img src="${fullImgUrl}" alt="${sprite.name}">
                        </div>
                        <div class="sprite-info">
                            <h3>${sprite.name}</h3>
                            <p><strong>Category:</strong> ${sprite.category}</p>
                            <p><strong>Author:</strong> ${sprite.author}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading sprites:", error);
                document.getElementById('spriteGrid').innerHTML = "<p>Failed to load sprites from API.</p>";
            }
        }

        // Run on page load
        fetchSprites();
    </script>
</body>
</html>
